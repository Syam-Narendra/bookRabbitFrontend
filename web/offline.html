<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>No Internet - BookRabbit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(180deg, #FFFBF8 0%, #FFF3EC 100%);
      color: #1E1E1E;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 440px;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .image-wrapper {
      width: 100%;
      max-width: 280px;
      margin-bottom: 28px;
      position: relative;
    }

    .image-wrapper img {
      width: 100%;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0px 12px 24px rgba(255, 82, 0, 0.08));
    }

    h1 {
      font-size: 26px;
      font-weight: 800;
      color: #1E1E1E;
      margin-bottom: 8px;
      letter-spacing: -0.4px;
    }

    p {
      font-size: 14.5px;
      font-weight: 500;
      color: #757575;
      line-height: 1.4;
      margin-bottom: 32px;
    }

    .btn-retry {
      width: 100%;
      height: 52px;
      background: #FF5200;
      color: #FFFFFF;
      border: none;
      border-radius: 16px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0px 8px 20px rgba(255, 82, 0, 0.28);
      transition: all 0.2s ease;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-retry:hover {
      background: #E04800;
      transform: translateY(-1px);
      box-shadow: 0px 10px 24px rgba(255, 82, 0, 0.35);
    }

    .btn-retry:active {
      transform: translateY(1px);
      box-shadow: 0px 4px 12px rgba(255, 82, 0, 0.2);
    }

    .icon-spin {
      width: 18px;
      height: 18px;
      border: 2.5px solid rgba(255, 255, 255, 0.4);
      border-top-color: #FFFFFF;
      border-radius: 50%;
      display: none;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .toast {
      position: fixed;
      bottom: 24px;
      background: #323232;
      color: #FFF;
      padding: 12px 20px;
      border-radius: 24px;
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.3s ease;
      pointer-events: none;
      box-shadow: 0 6px 16px rgba(0,0,0,0.15);
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="image-wrapper">
      <img src="assets/images/no_internet.png" id="rabbitImg" alt="No Internet" onerror="this.onerror=null; this.src='assets/assets/images/no_internet.png';">
    </div>

    <h1>No Internet</h1>
    <p>Check your connection and try again.</p>

    <button class="btn-retry" id="retryBtn" onclick="handleTryAgain()">
      <div class="icon-spin" id="btnSpinner"></div>
      <svg id="refreshIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.5 2v6h-6M2.5 22v-6h6"></path>
        <path d="M2 11.5a10 10 0 0 1 18.8-4.3L21.5 8M22 12.5a10 10 0 0 1-18.8 4.2L2.5 16"></path>
      </svg>
      <span id="btnText">Try Again</span>
    </button>
  </div>

  <div class="toast" id="toast">Still offline. Please check your network.</div>

  <script>
    // Auto-reload as soon as internet connection is restored
    window.addEventListener('online', function() {
      showToast('Internet restored! Reloading...');
      setTimeout(() => {
        window.location.reload();
      }, 500);
    });

    function handleTryAgain() {
      const btn = document.getElementById('retryBtn');
      const spinner = document.getElementById('btnSpinner');
      const icon = document.getElementById('refreshIcon');
      const btnText = document.getElementById('btnText');

      spinner.style.display = 'block';
      icon.style.display = 'none';
      btnText.textContent = 'Checking...';
      btn.disabled = true;

      if (navigator.onLine) {
        // Double check network request
        fetch(window.location.origin + '/favicon.png?cacheBust=' + Date.now(), { method: 'HEAD', mode: 'no-cors' })
          .then(() => {
            window.location.reload();
          })
          .catch(() => {
            resetBtn();
            showToast('Still offline. Please check your Wi-Fi or Mobile Data.');
          });
      } else {
        setTimeout(() => {
          resetBtn();
          showToast('Still offline. Please check your network connection.');
        }, 600);
      }
    }

    function resetBtn() {
      const btn = document.getElementById('retryBtn');
      const spinner = document.getElementById('btnSpinner');
      const icon = document.getElementById('refreshIcon');
      const btnText = document.getElementById('btnText');

      spinner.style.display = 'none';
      icon.style.display = 'block';
      btnText.textContent = 'Try Again';
      btn.disabled = false;
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }
  </script>
</body>
</html>
