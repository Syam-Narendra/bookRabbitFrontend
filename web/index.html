<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Book Rabbit lets you instantly book your favourite sports grounds.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Book Rabbit">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Google Fonts - Plus Jakarta Sans (Unified Premium iOS-Style Font) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
  </style>

  <!-- Razorpay Checkout JavaScript SDK for Web -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script>
    function openRazorpayCheckout(optionsJsonString, successCb, errorCb) {
      try {
        var options = JSON.parse(optionsJsonString);
        options.handler = function (response) {
          if (successCb) {
            successCb(
              response.razorpay_payment_id || '',
              response.razorpay_order_id || '',
              response.razorpay_signature || ''
            );
          }
        };
        options.modal = options.modal || {};
        options.modal.ondismiss = function () {
          if (errorCb) {
            errorCb(2, "Payment cancelled by user");
          }
        };
        var rzp = new Razorpay(options);
        rzp.on('payment.failed', function (response) {
          if (errorCb) {
            var err = response.error || {};
            errorCb(err.code || 1, err.description || "Payment failed");
          }
        });
        rzp.open();
      } catch (e) {
        console.error("Razorpay web checkout initialization error:", e);
        if (errorCb) {
          errorCb(0, e.message || "Failed to initialize Razorpay checkout");
        }
      }
    }
  </script>

  <title>Book Rabbit</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
